<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball Popper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="hud">
      <h1>Ball Popper</h1>
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
        <span>Left: <strong id="left">0</strong></span>
      </div>
    </header>

    <section class="controls">
      <label for="targetSlider">
        Targets at the top: <strong id="targetCount">15</strong>
      </label>
      <input type="range" id="targetSlider" min="1" max="40" value="15" />
      <button id="startBtn">Start</button>
    </section>

    <canvas id="board" width="600" height="500"></canvas>

    <p id="message" class="message">Pick how many targets, then press Start.</p>
    <p class="hint">Move the paddle with your mouse or the ← → arrow keys.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
